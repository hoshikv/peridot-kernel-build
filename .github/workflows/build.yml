name: Build kernel + vendor_dlkm

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Verify submodules
        run: |
          echo "=== kernel ==="
          test -f kernel/Makefile && echo "kernel OK ($(git -C kernel rev-parse --short HEAD))" || echo "kernel MISSING"
          echo "=== port-doze2 display driver (in kernel tree) ==="
          test -f kernel/qcom/opensource/display-drivers/msm/Kbuild && echo "display OK" || echo "display MISSING"
          echo "=== internals.h ==="
          test -f "$PWD/kernel/kernel/irq/internals.h" && echo "internals.h OK" || echo "internals.h MISSING"

      - name: Restore build dir
        id: cache-out
        uses: actions/cache@v4
        with:
          path: out
          key: peridot-full-v2-${{ hashFiles('kernel/qcom/opensource/display-drivers/**') }}-${{ github.sha }}
          restore-keys: peridot-full-v2-
          save-always: true

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git bc bison flex libssl-dev libelf-dev python3 \
            ca-certificates wget file unzip gzip
          df -h / | tail -1

      - name: Download Android clang prebuilt
        id: clang
        uses: actions/cache@v4
        with:
          path: toolchain/clang-r530567
          key: clang-r530567

      - name: Fetch clang if not cached
        if: steps.clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchain
          curl -L --fail -o toolchain/clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r530567.tar.gz"
          mkdir -p toolchain/clang-r530567
          tar -xzf toolchain/clang.tar.gz -C toolchain/clang-r530567
          rm toolchain/clang.tar.gz
          toolchain/clang-r530567/bin/clang --version | head -1

      - name: Install erofs-utils
        run: |
          sudo apt-get install -y -qq erofs-utils 2>/dev/null || {
            cd /tmp
            git clone --depth 1 https://git.kernel.org/pub/scm/linux/kernel/git/xiang/erofs-utils.git
            cd erofs-utils
            ./autogen.sh && ./configure --prefix=/usr && make -j$(nproc) && sudo make install
          }
          which mkfs.erofs && mkfs.erofs --version || true

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-kernel
          max-size: 4G

      - name: Build kernel + modules + vendor_dlkm
        env:
          KERNEL_DIR: ${{ github.workspace }}/kernel
          DD_DIR: ${{ github.workspace }}/display-drivers
          CLANG_DIR: ${{ github.workspace }}/toolchain/clang-r530567
          JOBS: 4
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          df -h / | tail -1
          chmod +x build.sh
          ./build.sh
          df -h / | tail -1

      - name: Summary
        run: |
          echo "=== Build artifacts ==="
          ls -lh out/Image out/Image.gz out/msm_drm.ko out/vendor_dlkm.img 2>/dev/null
          echo "=== vermagic ==="
          strings out/msm_drm.ko 2>/dev/null | grep -m1 "vermagic=" || true

      - name: Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image
          path: |
            out/Image
            out/Image.gz
          if-no-files-found: error

      - name: Upload msm_drm.ko
        uses: actions/upload-artifact@v4
        with:
          name: msm_drm-patched
          path: out/msm_drm.ko
          if-no-files-found: error

      - name: Upload vendor_dlkm.img
        uses: actions/upload-artifact@v4
        with:
          name: vendor_dlkm
          path: out/vendor_dlkm.img
          if-no-files-found: warn

      - name: Upload mmrm.log (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmrm-log
          path: out/mmrm.log
          if-no-files-found: ignore

      - name: Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TAG="build-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "kernel + vendor_dlkm $TAG" \
            --notes "auto build: Image + msm_drm.ko (doze patched) + vendor_dlkm.img" \
            out/Image out/Image.gz out/msm_drm.ko out/vendor_dlkm.img \
            --clobber 2>&1 || echo "release failed (non-fatal)"
