name: Build msm_drm.ko

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Restore build dir
        id: cache-out
        uses: actions/cache@v4
        with:
          path: out
          key: peridot-out-${{ hashFiles('display-drivers/**') }}-${{ github.sha }}
          restore-keys: peridot-out-

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git bc bison flex libssl-dev libelf-dev python3 \
            ca-certificates wget file unzip
          df -h / | tail -1

      - name: Download Android clang prebuilt (single version tarball)
        id: clang
        uses: actions/cache@v4
        with:
          path: toolchain/clang-r530567
          key: clang-r530567

      - name: Fetch clang if not cached
        if: steps.clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchain
          curl -L --fail -o toolchain/clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r530567.tar.gz"
          mkdir -p toolchain/clang-r530567
          tar -xzf toolchain/clang.tar.gz -C toolchain/clang-r530567
          rm toolchain/clang.tar.gz
          toolchain/clang-r530567/bin/clang --version | head -1

      - name: Build msm_drm.ko
        env:
          KERNEL_DIR: ${{ github.workspace }}/kernel
          DD_DIR: ${{ github.workspace }}/display-drivers
          CLANG_DIR: ${{ github.workspace }}/toolchain/clang-r530567
          JOBS: 4
        run: |
          df -h / | tail -1
          ./build.sh
          df -h / | tail -1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: msm_drm
          path: out/msm_drm.ko
          if-no-files-found: error