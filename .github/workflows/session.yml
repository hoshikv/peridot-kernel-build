name: Interactive Build Session
on:
  workflow_dispatch: {}
jobs:
  session:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_TOKEN }}

      - name: Start tmate + publish SSH info to gist
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TMATE_SOCK=/tmp/tmate.sock
          nohup tmate -S "$TMATE_SOCK" -F > "$HOME/tmate.log" 2>&1 &
          for i in $(seq 1 45); do
            tmate -S "$TMATE_SOCK" wait tmate-ready 2>/dev/null && break
            sleep 2
          done
          sleep 4
          SSH_LINE="$(tmate -S "$TMATE_SOCK" display -p '#{tmate_ssh}')"
          echo "$SSH_LINE" > "$GITHUB_WORKSPACE/tmate-ssh.txt"
          echo "SSH_LINE=[$SSH_LINE]"
          gh gist create --public --desc "peridot-session-ssh" "$GITHUB_WORKSPACE/tmate-ssh.txt" 2>&1 | tee "$GITHUB_WORKSPACE/gist-url.txt"
          echo "RUN_ID=$GITHUB_RUN_ID"
          sleep 20000