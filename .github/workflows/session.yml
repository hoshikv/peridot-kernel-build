name: Interactive Build Session
on:
  workflow_dispatch: {}
jobs:
  session:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git bc bison flex libssl-dev libelf-dev python3 \
            ca-certificates wget file unzip
          df -h / | tail -1

      - name: Download Android clang prebuilt
        run: |
          mkdir -p toolchain
          curl -L --fail -o toolchain/clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r530567.tar.gz"
          mkdir -p toolchain/clang-r530567
          tar -xzf toolchain/clang.tar.gz -C toolchain/clang-r530567
          rm toolchain/clang.tar.gz
          toolchain/clang-r530567/bin/clang --version | head -1

      - name: Start tmate + keep alive
        run: |
          sudo apt-get install -y -qq tmate
          tmate -F &
          for i in $(seq 1 30); do
            tmate wait tmate-ready 2>/dev/null && break
            sleep 2
          done
          sleep 5
          {
            echo "WEB_SESSION=$(tmate display -p '#{tmate_web}')"
            echo "SSH_CMD=$(tmate display -p '#{tmate_ssh}')"
          } | tee "$GITHUB_WORKSPACE/tmate-url.txt"
          wc -c "$GITHUB_WORKSPACE/tmate-url.txt"
          echo "=== waiting for ssh connection; runner lives while this sleeps ==="
          echo "RUN_ID=$GITHUB_RUN_ID"
          sleep 20000

      - name: Upload tmate connection info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmate-url
          path: tmate-url.txt
