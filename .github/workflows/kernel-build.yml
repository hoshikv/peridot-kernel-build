name: Build Kernel (GuidixX vanilla + AnyKernel zip)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kernel-build.yml'

concurrency:
  group: kernel-zip-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout (with kernel submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Verify kernel submodule
        run: |
          test -f kernel/Makefile && echo "kernel OK ($(git -C kernel rev-parse --short HEAD))" || { echo "kernel submodule MISSING"; exit 1; }
          grep -E "^(VERSION|PATCHLEVEL|SUBLEVEL) = " kernel/Makefile | paste -sd. -
          grep "^CONFIG_LOCALVERSION" kernel/arch/arm64/configs/gki_defconfig

      - name: Free disk & setup swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo swapoff -a || true
          sudo fallocate -l 24G /swapfile && sudo chmod 600 /swapfile
          sudo mkswap /swapfile && sudo swapon /swapfile
          df -h / && free -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make gcc libssl-dev bc bison flex ccache \
            cpio zip xz-utils zstd lz4 p7zip-full libelf-dev dwarves python3 perl \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          ccache --max-size=2G

      - name: Setup clang toolchain
        run: |
          mkdir -p ../toolchain
          if [ ! -d "../toolchain/clang" ]; then
            git clone --depth=1 https://gitlab.com/kei-space/clang/r547379 ../toolchain/clang
          fi
          ../toolchain/clang/bin/clang --version

      - name: Build kernel
        id: build
        env:
          KBUILD_BUILD_USER: "Chidori"
          KBUILD_BUILD_HOST: "GitHubActions"
        run: |
          set -e
          set -o pipefail
          export PATH="$PWD/../toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          # export LOCALVERSION empty so setlocalversion does NOT append a dirty '+'
          # to the vermagic (would break matching the stock KMI vermagic)
          export LOCALVERSION=
          cd kernel
          # bump GuidixX 6.1.174 -> 6.1.175 and force KMI-stock LOCALVERSION at build
          # time (mirrors the proven kernelxc builder; repo history stays at b1e751ce)
          sed -i 's/^SUBLEVEL = 174$/SUBLEVEL = 175/' Makefile
          sed -i 's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-android14-11-ga3b9c44908dd-ab13320413"/' arch/arm64/configs/gki_defconfig
          mkdir -p out
          # merge gki + vendor fragments + safe optimizations (drops debug bloat, KMI unchanged)
          MERGE_LIST=(
            arch/arm64/configs/gki_defconfig
            arch/arm64/configs/vendor/pineapple_GKI.config
            arch/arm64/configs/vendor/peridot_GKI.config
            ../optimize.config
          )
          ./scripts/kconfig/merge_config.sh -m -r -O out "${MERGE_LIST[@]}" 2>&1 | tee defconfig.log
          # Tune config (same as proven kernelxc build): WERROR off, and disable
          # MODULE_SIG* so STOCK (unsigned) vendor_dlkm modules still load at boot.
          CFG=./scripts/config
          $CFG --file out/.config -d WERROR
          $CFG --file out/.config -d DEBUG_INFO_BTF
          $CFG --file out/.config -d DEBUG_INFO_DWARF5
          $CFG --file out/.config -d MODULE_SIG
          $CFG --file out/.config -d MODULE_SIG_FORCE
          $CFG --file out/.config -d MODULE_SIG_PROTECT
          $CFG --file out/.config -d MODULE_SIG_ALL
          $CFG --file out/.config -d MODULE_SIG_SHA256
          $CFG --file out/.config --set-str MODULE_SIG_HASH "sha1"
          make O=out ARCH=arm64 olddefconfig CC=clang 2>&1 | tee -a defconfig.log
          echo "Kernel release: $(cat out/include/config/kernel.release)"
          JOBS=$(( $(nproc) - 2 )); [ "$JOBS" -lt 1 ] && JOBS=1
          echo "JOBS=$JOBS"
          make -j"$JOBS" O=out \
            CC=clang LLVM=1 LLVM_IAS=1 LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CCACHE=1 Image dtbs modules 2>&1 | tee ../build.log
          cd ..
          echo "VERMAGIC=$(cat kernel/out/include/config/kernel.release)" >> "$GITHUB_OUTPUT"
          ls -lh kernel/out/arch/arm64/boot/Image kernel/out/arch/arm64/boot/Image.gz 2>/dev/null || true

      - name: Verify release
        run: |
          echo "=== .config highlights ==="
          grep -E "CONFIG_LOCALVERSION|CONFIG_HYBRIDSWAP|CONFIG_DRM_MSM|CONFIG_QCOM_PANEL_EVENT_NOTIFIER" kernel/out/.config || true
          echo "=== kernel.release ==="
          cat kernel/out/include/config/kernel.release
          echo ""
          echo "=== vermagic in Image ==="
          strings kernel/out/arch/arm64/boot/Image | grep -m1 "vermagic=" || true

      - name: Collect module ko files
        run: |
          set -e
          mkdir -p modules
          cp -fp kernel/out/drivers/power/supply/qti_battery_charger.ko modules/ 2>/dev/null || echo "WARN: qti_battery_charger.ko not built"
          cp -fp kernel/out/drivers/soc/qcom/pmic_glink.ko modules/ 2>/dev/null || echo "WARN: pmic_glink.ko not built"
          ls -lh modules/ || true
          for m in modules/*.ko; do
            [ -e "$m" ] || continue
            modinfo "$m" | grep -E "vermagic|filename|name" | head -5
            echo "---"
          done

      - name: Package AnyKernel zip
        run: |
          set -e
          ZIMAGE=kernel/out/arch/arm64/boot
          mkdir -p tmp
          if [ -f "$ZIMAGE/Image.gz" ]; then
            cp -fp "$ZIMAGE/Image.gz" tmp/
          elif [ -f "$ZIMAGE/Image" ]; then
            gzip -9 -f -k "$ZIMAGE/Image" && cp -fp "$ZIMAGE/Image.gz" tmp/
          else
            echo "::error::no kernel image found"; exit 1
          fi
          cp -rp ./anykernel/* tmp/
          cd tmp
          7za a -mx9 ../Chidori-Kernel-peridot.zip *
          cd ..
          echo "=== zip contents ==="
          7za l Chidori-Kernel-peridot.zip | grep -E "Image|anykernel.sh" || true
          ls -lh Chidori-Kernel-peridot.zip

      - name: Show vermagic
        run: |
          echo "Kernel release: ${{ steps.build.outputs.VERMAGIC }}"
          grep -E "CONFIG_LOCALVERSION" kernel/out/.config || true

      - name: Upload AnyKernel zip
        uses: actions/upload-artifact@v4
        with:
          name: Chidori-Kernel-peridot
          path: |
            Chidori-Kernel-peridot.zip
            build.log
            defconfig.log
            kernel/out/include/config/kernel.release
          if-no-files-found: error
          retention-days: 7

      - name: Upload module ko files
        uses: actions/upload-artifact@v4
        with:
          name: qti-battery-ko
          path: modules/
          if-no-files-found: warn
          retention-days: 7